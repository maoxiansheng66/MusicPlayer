name: Build Windows Exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    # 修正点 1: 这是一个独立的步骤，必须缩进对齐
    - name: Set Locale to Chinese
      run: |
        # 设置系统区域为中文（中国）
        Set-WinSystemLocale zh-CN
        Set-WinUserLanguageList zh-CN -Force
        # 设置控制台代码页为 UTF-8
        chcp 65001
      # 修正点 2: shell 必须和 run 对齐，且单独一行
      shell: powershell

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: pyinstaller --onefile --noconsole --name "定时播放系统" --icon=app.ico --add-data "app.ico;." main.py

    # 调试步骤：查看 dist 目录里到底生成了什么文件
    - name: List dist folder
      run: dir dist
      shell: cmd

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: dist/定时播放系统.exe
