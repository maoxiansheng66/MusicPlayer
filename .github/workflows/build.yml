name: Build Windows Exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      # 显式指定 cmd shell，避免编码歧义
      shell: cmd
      run: |
        # 先清理一下可能存在的旧文件夹，防止 PyInstaller 因为文件夹重名报错
        rmdir /s /q dist build
        pyinstaller --onefile --noconsole --name "Timer" --icon=app.ico --add-data "app.ico;." main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Timer_Installer
        path: dist/Timer.exe
